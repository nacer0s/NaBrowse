[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/network",
    "crates/html",
    "crates/css",
    "crates/layout",
    "crates/paint",
    "crates/javascript",
    "crates/browser-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
